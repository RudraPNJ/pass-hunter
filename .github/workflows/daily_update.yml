name: Daily Satellite Orbit Update

on:
  schedule:
    - cron: '0 2 * * *' # Runs automatically at 2:00 AM every night
  workflow_dispatch: # Gives you a button to run it manually on GitHub

permissions:
  contents: write

jobs:
  update-passes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install skyfield numpy tabpfn
          
      - name: Run Pass Hunter AI Pipeline
        run: |
          # Runs your script to fetch fresh orbits and TabPFN scores
          python generate_session.py

      - name: Commit Fresh Data to Website
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile_app/index.html mobile_app/manifest.json
          # Only commit if the HTML actually changed today
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-update tonight's satellite passes"
          git push
